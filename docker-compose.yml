services:
  app:
    build: .
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in .env}
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: /data/db.sqlite3
      STATIC_ROOT: /static
    volumes:
      - app_data:/data
      - static_data:/static
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    init: true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  app_data:
  static_data:
  caddy_data:
  caddy_config:
